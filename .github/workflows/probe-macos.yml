name: probe-macos
on: workflow_dispatch

jobs:
  probe:
    runs-on: macos-15
    steps:
      - name: host facts
        run: |
          uname -m; sw_vers
          sysctl -n machdep.cpu.brand_string || true
          echo "--- hypervisor support"
          sysctl -a 2>/dev/null | grep -i "hv_" | head -20 || echo "(no hv_ sysctls)"
      - name: install podman and krunkit
        run: |
          set -x
          brew install podman
          brew tap libkrun/krun
          brew trust libkrun/krun || true
          brew install krunkit
          podman --version
          command -v krunkit && krunkit --version
      - name: provider list
        run: |
          podman machine info || true
          podman info --format '{{.Host.OCIRuntime.Name}}' || true
      - name: try libkrun machine
        run: |
          set -x
          podman machine init --provider libkrun --cpus 2 --memory 2048 lk
          podman machine start lk
          podman machine ssh lk uname -m
      - name: try running a container
        run: |
          set -x
          podman run --rm alpine:latest uname -m
      - name: machine logs on failure
        if: failure()
        run: |
          podman machine list || true
          podman machine inspect lk || true
          ls -la ~/.local/share/containers/podman/machine/ 2>/dev/null || true
